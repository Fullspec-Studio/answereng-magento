name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    name: test (PHP ${{ matrix.php }}, Magento ${{ matrix.magento }})
    strategy:
      fail-fast: false
      matrix:
        # Each Magento line on the PHP versions it supports. "locked" is composer.lock as committed.
        include:
          - {magento: '2.4.6', php: '8.1'}
          - {magento: '2.4.6', php: '8.2'}
          - {magento: '2.4.7', php: '8.2'}
          - {magento: '2.4.7', php: '8.3'}
          - {magento: '2.4.8', php: '8.3'}
          - {magento: '2.4.8', php: '8.4'}
          - {magento: locked, php: '8.3'}
          - {magento: locked, php: '8.4'}
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: answereng_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      ANSWERENG_TEST_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=answereng_test
      ANSWERENG_TEST_DB_USER: root
      ANSWERENG_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, ctype, curl, dom, ftp, gd, intl, mbstring, pdo_mysql, soap, sodium, xsl, zip
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: vendor
          key: vendor-${{ matrix.php }}-${{ matrix.magento }}-${{ hashFiles('composer.lock') }}
      - run: composer validate --strict
      - name: Install (composer.lock)
        if: matrix.magento == 'locked'
        run: composer install --no-interaction --no-progress
      - name: Install (Magento ${{ matrix.magento }} packages)
        if: matrix.magento != 'locked'
        run: |
          X="${MAGENTO##*.}"
          composer update --no-interaction --no-progress --with-all-dependencies \
            --with "magento/framework:103.0.$X.*" --with "magento/module-backend:102.0.$X.*" \
            --with "magento/module-catalog:104.0.$X.*" --with "magento/module-config:101.2.$X.*" \
            --with "magento/module-cron:100.4.$X.*" --with "magento/module-customer:103.0.$X.*" \
            --with "magento/module-store:101.1.$X.*"
          composer show magento/framework | grep '^versions'
        env:
          MAGENTO: ${{ matrix.magento }}
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpcs
      - run: vendor/bin/phpstan analyse --no-progress
